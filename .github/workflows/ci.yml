name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # A manual run scans the whole history for secrets, a push only its own commits.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # The music tests skip without ffmpeg.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:unit

  secrets:
    runs-on: ubuntu-latest
    # The action lists a pull request's commits through the API.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
